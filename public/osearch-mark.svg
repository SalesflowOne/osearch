<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="OSearch">
  <!-- Ring of 7 white nodes + cyan lens crown (search variant of the OWeb Source) -->
  <g transform="translate(32 32)">
    <!-- nodes at 45° except 12 o'clock (replaced by lens) -->
    <circle cx="0" cy="-21" r="0" fill="#FFFFFF"/>
    <circle cx="14.849" cy="-14.849" r="4.2" fill="#FFFFFF"/>
    <circle cx="21" cy="0" r="4.2" fill="#FFFFFF"/>
    <circle cx="14.849" cy="14.849" r="4.2" fill="#FFFFFF"/>
    <circle cx="0" cy="21" r="4.2" fill="#FFFFFF"/>
    <circle cx="-14.849" cy="14.849" r="4.2" fill="#FFFFFF"/>
    <circle cx="-21" cy="0" r="4.2" fill="#FFFFFF"/>
    <circle cx="-14.849" cy="-14.849" r="4.2" fill="#FFFFFF"/>
    <!-- lens crown at 12 o'clock -->
    <circle cx="0" cy="-16.5" r="7.2" stroke="#22D3EE" stroke-width="3.2" fill="none"/>
    <line x1="5.1" y1="-11.4" x2="10.2" y2="-6.3" stroke="#22D3EE" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
